name: Build README

"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 */3 * * *" # Run every three hours.
  workflow_dispatch:

jobs:
  build:
    name: Build README

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: build
        name: 🏗 Compile the builder
        run: npm run build

      - id: build-readme
        name: 📝 Build README
        run: npm run build-readme

      - id: commit-and-push
        name: 🚀 Commit and push changes if anything changed
        run: |-
          git config user.name "README Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m ":timer_clock: Updated README from the CI" || exit 0
          git push
