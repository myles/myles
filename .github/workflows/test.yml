name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: prettier-check
        name: 💅 Run Prettier check
        run: npm run prettier

      - id: lint
        name: 🔍 Run oxlint
        run: npm run lint

  test:
    name: Test on Node.js ${{ matrix.node-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: test
        name: 🧪 Run tests
        run: npm test

  coverage:
    name: Coverage

    runs-on: ubuntu-latest

    steps:
      - id: checkout
        name: 📥 Checkout code
        uses: actions/checkout@v7

      - id: setup-node
        name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "package.json"
          cache: "npm"

      - id: install-dependencies
        name: 📦 Install dependencies
        run: npm ci

      - id: coverage
        name: 📊 Run tests with coverage
        run: npm run test:coverage
